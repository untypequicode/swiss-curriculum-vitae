# Configuration de static-web-server (https://static-web-server.net)

[general]
port = 8080
root = "/public"
log-level = "info"
health = true # expose /health, sans journal

compression = true
cache-control-headers = true # cache long pour les fichiers statiques, en fonction du type

[advanced]

# Les fichiers de assets/ ont une empreinte dans leur nom : cache d'un an, sans revalidation
[[advanced.headers]]
source = "/assets/**"
headers.Cache-Control = "public, max-age=31536000, immutable"

# Polices et photos : le nom du fichier peut rester le même quand il change, cache d'une semaine
[[advanced.headers]]
source = "/{fonts,img}/**"
headers.Cache-Control = "public, max-age=604800"

# La page d'accueil est toujours revalidée pour récupérer les nouvelles empreintes
[[advanced.headers]]
source = "/index.html"
headers.Cache-Control = "no-cache"

# En-têtes de sécurité sur toutes les réponses
[[advanced.headers]]
source = "**/*"
headers.X-Content-Type-Options = "nosniff"
headers.X-Frame-Options = "DENY"
headers.Referrer-Policy = "no-referrer"
headers.Permissions-Policy = "camera=(), microphone=(), geolocation=()"
headers.Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
